name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v1.64.8
  GOVULNCHECK_VERSION: v1.1.4

jobs:
  build:
    name: Build, lint, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install tools
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
      - name: Install poppler-utils
        # Provides pdftotext so extract/pdf/pdftotext's real round-trip test runs
        # (it skips when absent). Cheap, stable apt package.
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Lint
        run: golangci-lint run
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Vulncheck
        run: govulncheck ./...
      - name: Test
        run: go test -cover ./...
